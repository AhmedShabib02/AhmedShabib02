name: Profile

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'banner.svg'
  schedule:
    - cron: "0 18 * * 0"     # Sundays — the graph moves slowly
  workflow_dispatch:

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Only when you actually touch the README or banner.
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --exclude linkedin.com README.md
          fail: true
      - run: test -f banner.svg || (echo "::error::banner.svg is missing" && exit 1)

  # Weekly, or when you press the button. Never on push.
  contrib-graph:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet && echo "No change." && exit 0
          git commit -m "chore: regenerate 3D contribution graph"
          git push
